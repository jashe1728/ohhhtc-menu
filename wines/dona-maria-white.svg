<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="60%" stop-color="#F1E8D6"/>
      <stop offset="100%" stop-color="#E3D5BC"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="45%" stop-color="#1E5C44"/>
      <stop offset="100%" stop-color="#123B2C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B2B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Chic background -->
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="580" fill="none" stroke="#1B2B4B" stroke-opacity="0.08" stroke-width="3"/>

  <!-- subtle table line -->
  <rect x="0" y="470" width="600" height="130" fill="#1B2B4B" opacity="0.06"/>

  <!-- Wine glass (left) -->
  <g filter="url(#shadow)">
    <!-- bowl -->
    <path d="M150,140 C150,260 190,300 218,300 C246,300 286,260 286,140 Z"
          fill="url(#glass)" stroke="#1B2B4B" stroke-opacity="0.25" stroke-width="2"/>
    <!-- wine in bowl -->
    <path d="M154,210 C158,270 190,294 218,294 C246,294 276,270 280,210 Z" fill="#E9D8A6" opacity="0.92"/>
    <path d="M154,210 C158,270 190,294 218,294 C246,294 276,270 280,210 Z"
          fill="none" stroke="#C9B27A" stroke-opacity="0.5" stroke-width="2"/>
    <!-- shine -->
    <path d="M170,170 C176,220 180,250 186,280" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- stem + base -->
    <path d="M218,300 L218,390" stroke="#1B2B4B" stroke-opacity="0.4" stroke-width="5"/>
    <path d="M158,408 C170,416 266,416 278,408 L270,428 C260,434 176,434 166,428 Z"
          fill="rgba(255,255,255,0.5)" stroke="#1B2B4B" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- Bottle (right) -->
  <g filter="url(#shadow)">
    <!-- neck + shoulders -->
    <path d="M322,120 L342,120 L348,170 L308,170 Z" fill="url(#bottle)"/>
    <!-- cap/foil -->
    <rect x="322" y="112" width="20" height="18" rx="3" fill="#1B2B4B"/>
    <rect x="318" y="118" width="28" height="8" rx="2" fill="#89C4E1"/>
    <!-- body -->
    <rect x="300" y="170" width="76" height="300" rx="18" fill="url(#bottle)"/>
    <rect x="300" y="170" width="76" height="300" rx="18" fill="none" stroke="#0A2A1F" stroke-width="2"/>
    <!-- label -->
    <rect x="308" y="230" width="60" height="160" rx="6" fill="#FDFAF4" stroke="#1B2B4B" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="312" y="236" width="52" height="8" fill="#89C4E1" opacity="0.8"/>
    <text x="372" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#FDFAF4">Dona Maria</text>
    <rect x="312" y="352" width="52" height="4" fill="#89C4E1" opacity="0.6"/>
  </g>

  <!-- small brand mark -->
  <text x="300" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic"
        fill="#1B2B4B" opacity="0.4">OhhhTC · Vinhos</text>
</svg>
